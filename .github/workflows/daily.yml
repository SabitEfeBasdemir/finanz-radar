# Gün içinde birkaç kez ücretsiz otomatik güncelleme (Claude kullanmaz).
# Saatler UTC; Almanya saati kışın +1, yazın +2.
# Dakikalar bilerek tam saat/yarım saat değil: GitHub yoğun anlarda (:00, :30) zamanlanmış çalışmaları düşürebiliyor.
#   04:47 UTC  -> 05:47  sabah özeti (gece ABD kapanışı + Asya)
#   09:23 UTC  -> 10:23  Avrupa açılışından sonra
#   12:17 UTC  -> 13:17  öğlen, ABD öncesi şirket açıklamaları (hafta sonu da)
#   14:53 UTC  -> 15:53  ABD açılışından (15:30) sonra
#   17:41 UTC  -> 18:41  akşam, Avrupa kapanışı
#   21:19 UTC  -> 22:19  ABD kapanışı ve kapanış sonrası bilançolar
# Hafta sonu sabah, öğlen ve akşam.
name: Günlük güncelleme
on:
  schedule:
    - cron: "47 4 * * *"
    - cron: "23 9 * * 1-5"
    - cron: "17 12 * * *"
    - cron: "53 14 * * 1-5"
    - cron: "41 17 * * *"
    - cron: "19 21 * * 1-5"
    - cron: "57 12 15 11 *"  # tek seferlik test: 15 Kasım 13:57
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Şirket listesi (ayda bir)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            pip install --quiet pandas lxml
            python scripts/build_universe.py
          fi
      - name: Sektör sıralaması
        run: python scripts/update_sectors.py
      - name: Haber taraması
        run: python scripts/fetch_news.py
      - name: Fiyatlar
        run: python scripts/update_prices.py
      - name: Kaydet ve yükle
        run: |
          for f in data/*.json; do python -m json.tool "$f" > /dev/null; done
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "Otomatik güncelleme $(date -u +%F)"
          git pull --rebase --quiet
          git push
