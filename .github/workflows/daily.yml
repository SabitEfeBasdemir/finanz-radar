# Gün içinde birkaç kez ücretsiz otomatik güncelleme (Claude kullanmaz).
#
# ASIL TETİKLEYİCİ: cron-job.org (ücretsiz dış zamanlayıcı), Almanya saatiyle tam saatinde, her gün
#   06:00, 10:00, 13:00, 16:00, 19:00, 23:00
# GitHub API'ye "workflow_dispatch" isteği gönderir (yalnızca bu repoda Actions izni olan kısıtlı bir anahtarla).
#
# YEDEK: GitHub'ın kendi zamanlayıcısı (aşağıdaki "schedule", her tam saatten 40 dk sonra, UTC).
# GitHub bunları çoğu zaman geç başlatır. Son otomatik güncelleme 100 dakikadan yeniyse yedek çalışma kendini
# atlar; böylece cron-job.org çalışıyorsa çift tarama olmaz, bir gün çalışmazsa site yine güncellenir.
name: Günlük güncelleme
on:
  schedule:
    - cron: "40 5,9,12,15,18,22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: read
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Yedek çalışma gerekli mi?
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(git log -1 --format=%ct --author=radar-bot || echo 0)
            age=$(( $(date +%s) - ${last:-0} ))
            echo "son otomatik güncelleme $((age / 60)) dakika önce"
            if [ "$age" -lt 6000 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "yakın zamanda güncellendi, atlanıyor"; fi
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Şirket listesi (ayda bir)
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            pip install --quiet pandas lxml
            python scripts/build_universe.py
          fi
      - name: Geri bildirimler (yalnızca repo sahibinin notları)
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "${{ github.repository }}" --label geri-bildirim --state all \
            --author "${{ github.repository_owner }}" --limit 100 --json number,title,body,createdAt > fb.json || echo '[]' > fb.json
          python scripts/export_feedback.py fb.json
          rm -f fb.json
      - name: Sektör sıralaması
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/update_sectors.py
      - name: Haber taraması
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/fetch_news.py
      - name: Türkçe çeviri
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/translate_items.py
      - name: Fiyatlar
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/update_prices.py
      - name: Potansiyeli olan şirketler
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/potential.py
      - name: Kaydet ve yükle
        if: steps.guard.outputs.skip != 'true'
        run: |
          for f in data/*.json; do python -m json.tool "$f" > /dev/null; done
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "Otomatik güncelleme $(date -u +%F)"
          git pull --rebase --quiet
          git push
