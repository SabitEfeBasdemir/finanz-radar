# Gün içinde birkaç kez ücretsiz otomatik güncelleme (Claude kullanmaz).
# Saatler UTC; Almanya saati kışın +1, yazın +2. GitHub zamanlamayı 5–15 dk geciktirebilir.
#   05:00 UTC  -> 06:00  sabah özeti (gece ABD kapanışı + Asya)
#   09:30 UTC  -> 10:30  Avrupa açılışından sonra
#   12:30 UTC  -> 13:30  öğlen, ABD öncesi şirket açıklamaları
#   15:00 UTC  -> 16:00  ABD açılışından (15:30) sonra
#   18:00 UTC  -> 19:00  akşam, Avrupa kapanışı
#   21:30 UTC  -> 22:30  ABD kapanışı ve kapanış sonrası bilançolar
# Hafta sonu sadece sabah ve akşam.
name: Günlük güncelleme
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "30 9 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "0 18 * * *"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Şirket listesi (ayda bir)
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            pip install --quiet pandas lxml
            python scripts/build_universe.py
          fi
      - name: Sektör sıralaması
        run: python scripts/update_sectors.py
      - name: Haber taraması
        run: python scripts/fetch_news.py
      - name: Fiyatlar
        run: python scripts/update_prices.py
      - name: Kaydet ve yükle
        run: |
          for f in data/*.json; do python -m json.tool "$f" > /dev/null; done
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "Otomatik güncelleme $(date -u +%F)"
          git pull --rebase --quiet
          git push
